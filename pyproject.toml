[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# %TEMP%\pytest-of-<user> is unreadable on the dev machine; keep pytest temp dirs in the project.
addopts = ["--basetemp=.pytest_tmp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
