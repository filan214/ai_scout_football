target_club: "Arsenal FC"
target_league: "premier_league"
as_of_date: "2026-07-06"
analysis_season: "2025-26"
backtest: {as_of_date: "2025-07-01", season_n: "2024-25", season_n1: "2025-26"}
tiers_enabled: [1, 2]

ambition: "top4"
ambition_club_rank: {survive: 17, midtable: 10, top4: 4, title: 1}

squad:
  reliable_minutes: 900
  depth_targets: {ST: 2, W: 3, AM: 2, CM: 3, DM: 2, FB: 4, CB: 4}
  optional_groups: [AM, W]
  min_usage: 0.25
squad_rating_min_minutes: 600
min_rated_share: 0.5
upgrade_margin: 5.0
need_weights: {depth: 0.20, age: 0.15, contract: 0.15}
age_risk_threshold: 30
contract_risk_months: 12
priority_bands: {high: 60, medium: 35}
stat_weight_blend: 0.7

pool:
  min_minutes_share: 0.30
  min_matches_share: 0.5
  age_min: 18
  age_max: 27
  ideal_age: [22, 26]
  budget_m: 60
fit_weights: {performance: 0.6, age: 0.2, value: 0.2}
shortlist_size: 10
min_ranked_groups: 2
verdict_ranks: {priority_target: 3, strong_option: 5}
league_strength_floor: 0.6

position_stats:
  ST: [npxg, shots, xa, key_passes, successful_dribbles, xgot]
  W:  [xa, key_passes, successful_dribbles, npxg, shots, big_chances_created]
  AM: [xa, key_passes, npxg, successful_dribbles, accurate_passes_pct, shots]
  CM: [accurate_passes_pct, accurate_long_balls, key_passes, tackles, interceptions, xa]
  DM: [tackles, interceptions, ball_recoveries, accurate_passes_pct, accurate_passes, accurate_long_balls]
  FB: [tackles, interceptions, xa, key_passes, ball_recoveries, successful_dribbles]
  CB: [blocks, clearances, interceptions, tackles, accurate_passes_pct, accurate_long_balls]
rate_stats: [accurate_passes_pct]
stat_fallbacks: {npxg: xg}
possession_adjustment:
  reference: 0.5
  stats: [tackles, interceptions, clearances, blocks, ball_recoveries, defensive_actions]
coverage_threshold: 0.95
min_stats_per_group: 4

llm:
  provider: "openrouter"
  free_only: true
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  primary_model: "openrouter/free"
  fallback_models: []
  temperature: 0.2
  timeout_seconds: 180
  reasoning: null
  max_completion_tokens: 8192
  min_request_interval_seconds: 4

reports:
  small_sample_minutes_share: 0.5

evaluation:
  bootstrap_resamples: 1000
  ci: 0.95
  seed: 7
  perturbation: 0.1
  clubelo_timeout_seconds: 10
  calibration_clubs: 20
  calibration_max_ppg_rho: -0.6
  calibration_title_min_share: 0.3
  calibration_survive_max_share: 0.1
  calibration_min_evidence_share: 0.95
  calibration_top_clubs: 2
  calibration_top_max_high: 1

idmap: {name_threshold: 88, min_club_overlap: 3}

value_calibration: {sample_per_league: 25, seed: 7, max_date_gap_days: 92}

live: {min_found_share: 0.6}

scraping_delay_seconds: 3
scraping_max_retries: 3
